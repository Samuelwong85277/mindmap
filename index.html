<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🧠 思维导图 - 协作版</title>
<style>
:root {
  --bg: #ffffff; --text: #1a1a2e; --border: #e0e0e0; --hover: #f5f5f5;
  --accent: #4f46e5; --accent-light: #eef2ff; --node-hover: #f0f0ff;
  --sidebar-bg: #fafbfc; --shadow: 0 2px 8px rgba(0,0,0,0.08);
  --radius: 8px; --transition: 0.2s ease;
  --branch-colors: #4f46e5 #059669 #d97706 #dc2626 #7c3aed #0891b2 #be185d #65a30d;
}
[data-theme="dark"] {
  --bg: #1a1a2e; --text: #e0e0e0; --border: #333; --hover: #2a2a3e;
  --accent: #818cf8; --accent-light: #1e1b4b; --node-hover: #252545;
  --sidebar-bg: #16162a; --shadow: 0 2px 8px rgba(0,0,0,0.3);
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); height: 100vh; overflow: hidden; display: flex; flex-direction: column; }

/* Toolbar */
.toolbar {
  display: flex; align-items: center; gap: 8px; padding: 8px 16px;
  border-bottom: 1px solid var(--border); background: var(--sidebar-bg);
  z-index: 10; flex-shrink: 0;
}
.toolbar .brand { font-size: 18px; font-weight: 700; margin-right: 12px; }
.toolbar input[type="text"] {
  padding: 6px 12px; border: 1px solid var(--border); border-radius: var(--radius);
  background: var(--bg); color: var(--text); font-size: 13px; width: 180px;
}
.toolbar button, .toolbar .btn {
  padding: 6px 14px; border: 1px solid var(--border); border-radius: var(--radius);
  background: var(--bg); color: var(--text); cursor: pointer; font-size: 12px;
  display: flex; align-items: center; gap: 4px; transition: var(--transition);
  white-space: nowrap;
}
.toolbar button:hover, .toolbar .btn:hover { background: var(--hover); }
.toolbar button.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
.toolbar button.primary:hover { opacity: 0.9; }
.toolbar .spacer { flex: 1; }
.toolbar .sep { width: 1px; height: 24px; background: var(--border); margin: 0 4px; }
.toolbar .status { font-size: 12px; color: #999; }

/* Main layout */
.main { display: flex; flex: 1; overflow: hidden; position: relative; }

/* Outline panel */
.outline-panel {
  flex: 1; overflow-y: auto; padding: 24px 32px; min-width: 300px;
  background: var(--bg);
}
.outline-panel.focused { background: var(--bg); }

.outline-node { position: relative; }
.outline-content {
  display: flex; align-items: center; padding: 4px 8px; border-radius: 4px;
  cursor: text; min-height: 28px; transition: var(--transition);
  border: 1px solid transparent;
}
.outline-content:hover { background: var(--node-hover); }
.outline-content.active { border-color: var(--accent); background: var(--accent-light); }
.outline-content .dot {
  width: 6px; height: 6px; border-radius: 50%; margin-right: 8px; flex-shrink: 0;
}
.outline-content .text {
  flex: 1; outline: none; font-size: 14px; line-height: 1.6; min-width: 20px;
  white-space: pre-wrap; word-break: break-word;
}
.outline-content .text:empty::before {
  content: '输入内容...'; color: #ccc;
}
.outline-children { padding-left: 24px; }
.drag-handle { cursor: grab; color: #ccc; font-size: 12px; padding: 0 2px; opacity: 0; transition: var(--transition); user-select: none; }
.outline-content:hover .drag-handle { opacity: 1; }
.outline-content .collapse-btn {
  width: 16px; height: 16px; font-size: 10px; border: none; background: none;
  cursor: pointer; color: #999; display: flex; align-items: center; justify-content: center;
  margin-right: 2px; border-radius: 50%; transition: var(--transition);
  flex-shrink: 0;
}
.outline-content .collapse-btn:hover { background: #e0e0e0; color: #333; }

/* Mind map panel */
.mindmap-panel { flex: 1; overflow: hidden; position: relative; background: #fafbfc; min-width: 0; }
[data-theme="dark"] .mindmap-panel { background: #13132a; }
.mindmap-panel svg { width: 100%; height: 100%; }
.mindmap-panel.hidden { display: none; }
.outline-panel.hidden { display: none; }

/* Resizer */
.resizer {
  width: 4px; cursor: col-resize; background: var(--border);
  transition: var(--transition); flex-shrink: 0;
}
.resizer:hover { background: var(--accent); }

/* Sidebar */
.sidebar {
  width: 260px; border-left: 1px solid var(--border); background: var(--sidebar-bg);
  display: flex; flex-direction: column; flex-shrink: 0; overflow-y: auto;
}
.sidebar.hidden { display: none; }
.sidebar h3 { padding: 12px 16px 8px; font-size: 13px; color: #999; text-transform: uppercase; letter-spacing: 0.5px; }
.sidebar .section { padding: 0 16px 12px; }
.sidebar .room-info { font-size: 12px; color: #666; padding: 4px 0; }
.sidebar .room-code {
  font-size: 20px; font-weight: 700; letter-spacing: 3px; color: var(--accent);
  padding: 8px 12px; background: var(--accent-light); border-radius: var(--radius);
  text-align: center; margin: 4px 0; cursor: pointer;
}
.sidebar .peers { font-size: 12px; color: #666; }
.sidebar .peer-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 4px; }
.sidebar .peer-dot.online { background: #22c55e; }
.sidebar input[type="text"] {
  width: 100%; padding: 8px 12px; border: 1px solid var(--border); border-radius: var(--radius);
  background: var(--bg); color: var(--text); font-size: 13px; margin: 4px 0;
}
.sidebar .color-option {
  display: inline-block; width: 24px; height: 24px; border-radius: 50%; cursor: pointer;
  margin: 3px; border: 2px solid transparent; transition: var(--transition);
}
.sidebar .color-option:hover { transform: scale(1.2); }
.sidebar .color-option.active { border-color: var(--text); }

/* Toast */
.toast {
  position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
  background: #333; color: #fff; padding: 10px 24px; border-radius: 20px;
  font-size: 13px; z-index: 100; opacity: 0; transition: opacity 0.3s;
  pointer-events: none;
}
.toast.show { opacity: 1; }

/* Context menu */
.ctx-menu {
  position: fixed; background: var(--bg); border: 1px solid var(--border);
  border-radius: var(--radius); box-shadow: var(--shadow); z-index: 200;
  padding: 4px 0; min-width: 160px; display: none;
}
.ctx-menu .item {
  padding: 8px 16px; font-size: 13px; cursor: pointer; display: flex;
  align-items: center; gap: 8px; transition: var(--transition);
}
.ctx-menu .item:hover { background: var(--hover); }
.ctx-menu .item .key { margin-left: auto; color: #999; font-size: 11px; }

/* Modal */
.modal-overlay {
  position: fixed; inset: 0; background: rgba(0,0,0,0.4); z-index: 300;
  display: flex; align-items: center; justify-content: center;
}
.modal {
  background: var(--bg); border-radius: 12px; padding: 24px; max-width: 420px; width: 90%;
  box-shadow: 0 8px 32px rgba(0,0,0,0.2);
}
.modal h2 { font-size: 18px; margin-bottom: 16px; }
.modal p { font-size: 13px; color: #666; margin-bottom: 12px; }
.modal input { width: 100%; padding: 10px; border: 1px solid var(--border); border-radius: var(--radius); font-size: 14px; margin-bottom: 12px; }
.modal .actions { display: flex; gap: 8px; justify-content: flex-end; }
.modal .actions button { padding: 8px 20px; border-radius: var(--radius); border: 1px solid var(--border); cursor: pointer; font-size: 13px; background: var(--bg); }
.modal .actions button.primary { background: var(--accent); color: #fff; border-color: var(--accent); }

/* Export modal */
.export-options { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 12px 0; }
.export-options button {
  padding: 10px; border: 1px solid var(--border); border-radius: var(--radius);
  background: var(--bg); cursor: pointer; font-size: 13px; transition: var(--transition);
}
.export-options button:hover { background: var(--hover); }

@media (max-width: 768px) {
  .main { flex-direction: column; }
  .outline-panel, .mindmap-panel { flex: none; height: 50%; }
  .sidebar { width: 100%; height: auto; }
  .resizer { display: none; }
}
</style>
</head>
<body>

<!-- Toolbar -->
<div class="toolbar">
  <span class="brand">🧠 思维导图</span>
  <input type="text" id="docName" value="未命名思维导图" placeholder="文档名称">
  <span class="sep"></span>
  <button onclick="undo()" title="撤销 Ctrl+Z">↩</button>
  <button onclick="redo()" title="重做 Ctrl+Y">↪</button>
  <span class="sep"></span>
  <button id="btnOutline" class="primary" onclick="setView('outline')">📋 大纲</button>
  <button id="btnMindmap" onclick="setView('mindmap')">🧠 脑图</button>
  <button id="btnBoth" onclick="setView('both')">📐 双栏</button>
  <span class="sep"></span>
  <button onclick="addSibling()" title="添加同级 Enter">➕ 同级</button>
  <button onclick="addChild()" title="添加子级 Tab">↳ 子级</button>
  <span class="sep"></span>
  <button id="btnTheme" onclick="toggleTheme()">🌓</button>
  <button onclick="showImport()">📤 导入</button>
  <button onclick="showExport()">📥 导出</button>
  <span class="spacer"></span>
  <span class="status" id="collabStatus">💾 本地模式</span>
  <button onclick="showCollab()" id="btnCollab">👥 协作</button>
</div>

<!-- Main -->
<div class="main">
  <!-- Outline -->
  <div class="outline-panel" id="outlinePanel">
    <div id="outlineRoot"></div>
  </div>

  <!-- Resizer -->
  <div class="resizer" id="resizer"></div>

  <!-- Mind map -->
  <div class="mindmap-panel hidden" id="mindmapPanel">
    <svg id="mindmapSvg"></svg>
  </div>

  <!-- Sidebar -->
  <div class="sidebar hidden" id="sidebar">
    <h3>👥 协作</h3>
    <div class="section" id="collabSection">
      <button class="primary" onclick="createRoom()" style="width:100%;margin-bottom:8px;">🏠 创建房间</button>
      <p style="font-size:12px;color:#999;margin:8px 0;">或输入邀请码加入：</p>
      <input type="text" id="joinCode" placeholder="输入6位邀请码" maxlength="6" style="text-transform:uppercase;letter-spacing:2px;">
      <button onclick="joinRoom()" style="width:100%;margin-top:4px;">🚪 加入房间</button>
    </div>
    <div class="section" id="shareSection" style="display:none;">
      <p style="font-size:12px;color:#666;line-height:1.6;">
        🌐 <b>网页版协作方式：</b><br>
        导出 JSON 文件发给对方<br>
        对方用 <b>📤 导入</b> 打开即可编辑<br><br>
        💡 要实时多人协作？<br>
        在本地运行服务端：<br>
        <code style="background:#eee;padding:2px 4px;border-radius:3px;font-size:11px;">npm start</code>
      </p>
      <button onclick="exportFormat('json')" style="width:100%;margin-top:4px;">📤 导出 JSON 分享</button>
    </div>
    <div id="roomInfo" style="display:none;">
      <h3>🏠 我的房间</h3>
      <div class="section">
        <div class="room-info">邀请码（点击复制）：</div>
        <div class="room-code" id="roomCode" onclick="copyCode()" title="点击复制">------</div>
        <div class="peers" id="peerCount">👤 1 人在线</div>
        <button onclick="leaveRoom()" style="width:100%;margin-top:8px;color:#dc2626;">🚪 离开房间</button>
      </div>
    </div>
    <h3>🎨 节点颜色</h3>
    <div class="section" id="colorPalette"></div>
    <h3>⌨️ 快捷键</h3>
    <div class="section" style="font-size:12px;color:#666;line-height:1.8;">
      <div><b>Tab</b> 缩进（变为子节点）</div>
      <div><b>Shift+Tab</b> 提升（变为同级）</div>
      <div><b>Enter</b> 新建同级节点</div>
      <div><b>Shift+Enter</b> 新建子节点</div>
      <div><b>Backspace</b> 删除节点</div>
      <div><b>Ctrl+Z/Y</b> 撤销/重做</div>
      <div><b>Ctrl+K</b> 超链接</div>
    </div>
  </div>
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<!-- Context menu -->
<div class="ctx-menu" id="ctxMenu"></div>

<script>
// ==================== DATA MODEL ====================
let docName = '未命名思维导图';
let nodeIdCounter = 1;
let tree = { id: 'root', title: '中心主题', children: [], collapsed: false, color: 0 };
let activeNodeId = 'root';
let undoStack = [];
let redoStack = [];
let currentView = 'outline';

const branchColors = ['#4f46e5','#059669','#d97706','#dc2626','#7c3aed','#0891b2','#be185d','#65a30d'];

function newNodeId() { return 'n' + (nodeIdCounter++); }

function findNode(id, root) {
  if (root.id === id) return root;
  for (const child of root.children || []) {
    const found = findNode(id, child);
    if (found) return found;
  }
  return null;
}

function findParent(id, root, parent = null) {
  if (root.id === id) return parent;
  for (const child of root.children || []) {
    const found = findParent(id, child, root);
    if (found !== undefined) return found;
  }
  return undefined;
}

function cloneTree(node) {
  return JSON.parse(JSON.stringify(node));
}

function pushUndo() {
  undoStack.push(cloneTree(tree));
  if (undoStack.length > 100) undoStack.shift();
  redoStack = [];
}

// ==================== OUTLINE RENDERER ====================
function renderOutline() {
  const container = document.getElementById('outlineRoot');
  container.innerHTML = '';
  renderNode(container, tree, 0);
  
  // Restore focus
  if (activeNodeId) {
    const active = container.querySelector(`[data-id="${activeNodeId}"] .text`);
    if (active) {
      active.focus();
      const range = document.createRange();
      range.selectNodeContents(active);
      range.collapse(false);
      const sel = window.getSelection();
      sel.removeAllRanges();
      sel.addRange(range);
    }
  }
}

function renderNode(container, node, depth) {
  const div = document.createElement('div');
  div.className = 'outline-node';
  div.setAttribute('data-id', node.id);
  div.setAttribute('draggable', 'true');

  const content = document.createElement('div');
  content.className = 'outline-content';
  if (node.id === activeNodeId) content.classList.add('active');

  // Collapse toggle
  const hasChildren = node.children && node.children.length > 0;
  const collapseBtn = document.createElement('button');
  collapseBtn.className = 'collapse-btn';
  collapseBtn.textContent = node.collapsed ? '▶' : '▼';
  collapseBtn.style.visibility = hasChildren ? 'visible' : 'hidden';
  collapseBtn.onclick = (e) => {
    e.stopPropagation();
    node.collapsed = !node.collapsed;
    renderOutline();
  };
  content.appendChild(collapseBtn);

  // Dot
  const dot = document.createElement('span');
  dot.className = 'dot';
  dot.style.background = branchColors[node.color || 0];
  content.appendChild(dot);

  // Text
  const text = document.createElement('div');
  text.className = 'text';
  text.contentEditable = 'true';
  text.textContent = node.title;
  
  text.addEventListener('focus', () => { activeNodeId = node.id; updateActiveStyles(); });
  text.addEventListener('input', () => {
    pushUndo();
    node.title = text.textContent || '';
    scheduleSave();
    renderMindmapDebounced();
  });
  text.addEventListener('keydown', (e) => handleKeydown(e, node));
  content.appendChild(text);

  // Drag handle
  const handle = document.createElement('span');
  handle.className = 'drag-handle';
  handle.textContent = '⋮⋮';
  handle.onmousedown = (e) => { e.stopPropagation(); };
  content.appendChild(handle);

  content.addEventListener('click', (e) => {
    activeNodeId = node.id;
    updateActiveStyles();
  });

  div.appendChild(content);

  // Children container
  const childrenDiv = document.createElement('div');
  childrenDiv.className = 'outline-children';
  if (hasChildren && !node.collapsed) {
    node.children.forEach(child => renderNode(childrenDiv, child, depth + 1));
  } else if (hasChildren && node.collapsed) {
    const count = document.createElement('span');
    count.style.cssText = 'font-size:11px;color:#999;padding:2px 8px;';
    count.textContent = `(${node.children.length} 项)`;
    childrenDiv.appendChild(count);
  }
  div.appendChild(childrenDiv);

  // Drag and drop
  div.addEventListener('dragstart', (e) => {
    e.dataTransfer.setData('text/plain', node.id);
    div.style.opacity = '0.5';
  });
  div.addEventListener('dragend', () => { div.style.opacity = '1'; });
  div.addEventListener('dragover', (e) => {
    e.preventDefault();
    div.style.borderTop = '2px solid var(--accent)';
  });
  div.addEventListener('dragleave', () => { div.style.borderTop = ''; });
  div.addEventListener('drop', (e) => {
    e.preventDefault();
    div.style.borderTop = '';
    const dragId = e.dataTransfer.getData('text/plain');
    if (dragId === node.id) return;
    pushUndo();
    const dragNode = findNode(dragId, tree);
    if (!dragNode) return;
    const dragParent = findParent(dragId, tree);
    if (dragParent) {
      dragParent.children = dragParent.children.filter(c => c.id !== dragId);
    }
    // Insert before this node
    const targetParent = findParent(node.id, tree);
    if (targetParent) {
      const idx = targetParent.children.findIndex(c => c.id === node.id);
      targetParent.children.splice(idx, 0, dragNode);
    } else if (node.id === tree.id) {
      tree.children.unshift(dragNode);
    }
    renderOutline();
    scheduleSave();
  });

  container.appendChild(div);
}

function updateActiveStyles() {
  document.querySelectorAll('.outline-content').forEach(el => {
    el.classList.toggle('active', el.parentElement.getAttribute('data-id') === activeNodeId);
  });
}

// ==================== KEYBOARD ====================
function handleKeydown(e, node) {
  if (e.key === 'Tab') {
    e.preventDefault();
    if (e.shiftKey) {
      outdentNode(node);
    } else {
      indentNode(node);
    }
  } else if (e.key === 'Enter') {
    e.preventDefault();
    pushUndo();
    if (e.shiftKey) {
      addChildNode(node);
    } else {
      addSiblingNode(node);
    }
  } else if (e.key === 'Backspace' && node.title === '' && node.id !== 'root') {
    e.preventDefault();
    deleteNode(node);
  } else if ((e.ctrlKey || e.metaKey) && e.key === 'z') {
    e.preventDefault();
    undo();
  } else if ((e.ctrlKey || e.metaKey) && e.key === 'y') {
    e.preventDefault();
    redo();
  } else if ((e.ctrlKey || e.metaKey) && e.key === 'k') {
    e.preventDefault();
    const url = prompt('输入链接地址：', 'https://');
    if (url) {
      const text = document.querySelector(`[data-id="${node.id}"] .text`);
      if (text) {
        pushUndo();
        document.execCommand('createLink', false, url);
        node.title = text.textContent || '';
      }
    }
  }
}

function indentNode(node) {
  if (node.id === 'root') return;
  const siblings = getSiblings(node);
  const idx = siblings.indexOf(node);
  if (idx > 0) {
    pushUndo();
    const parent = findParent(node.id, tree);
    parent.children = parent.children.filter(c => c.id !== node.id);
    siblings[idx - 1].children = siblings[idx - 1].children || [];
    siblings[idx - 1].children.push(node);
    renderOutline();
    scheduleSave();
    setTimeout(() => focusNode(node.id), 10);
  }
}

function outdentNode(node) {
  const parent = findParent(node.id, tree);
  if (!parent || parent.id === 'root') return;
  const grandparent = findParent(parent.id, tree);
  if (!grandparent) return;
  pushUndo();
  parent.children = parent.children.filter(c => c.id !== node.id);
  const idx = grandparent.children.indexOf(parent);
  grandparent.children.splice(idx + 1, 0, node);
  renderOutline();
  scheduleSave();
  setTimeout(() => focusNode(node.id), 10);
}

function addSiblingNode(node) {
  if (node.id === 'root') {
    tree.children.push({ id: newNodeId(), title: '', children: [], collapsed: false, color: 0 });
  } else {
    const parent = findParent(node.id, tree);
    if (parent) {
      const idx = parent.children.indexOf(node);
      const newNode = { id: newNodeId(), title: '', children: [], collapsed: false, color: node.color };
      parent.children.splice(idx + 1, 0, newNode);
    }
  }
  renderOutline();
  scheduleSave();
  const siblingId = getNextSiblingId(node);
  if (siblingId) setTimeout(() => focusNode(siblingId), 10);
}

function addChildNode(node) {
  node.children = node.children || [];
  const newNode = { id: newNodeId(), title: '', children: [], collapsed: false, color: (node.color + 1) % branchColors.length };
  node.children.push(newNode);
  node.collapsed = false;
  renderOutline();
  scheduleSave();
  setTimeout(() => focusNode(newNode.id), 10);
}

function deleteNode(node) {
  if (node.id === 'root') return;
  pushUndo();
  const parent = findParent(node.id, tree);
  if (parent) {
    parent.children = parent.children.filter(c => c.id !== node.id);
  }
  const focusId = parent ? parent.id : 'root';
  renderOutline();
  scheduleSave();
  setTimeout(() => focusNode(focusId), 10);
}

function getSiblings(node) {
  const parent = findParent(node.id, tree);
  return parent ? parent.children : [tree];
}

function getNextSiblingId(node) {
  const siblings = getSiblings(node);
  const idx = siblings.indexOf(node);
  return siblings[idx + 1] ? siblings[idx + 1].id : null;
}

function focusNode(id) {
  const el = document.querySelector(`[data-id="${id}"] .text`);
  if (el) {
    activeNodeId = id;
    el.focus();
    updateActiveStyles();
  }
}

// ==================== UNDO/REDO ====================
function undo() {
  if (undoStack.length === 0) return;
  redoStack.push(cloneTree(tree));
  tree = undoStack.pop();
  activeNodeId = tree.id;
  renderOutline();
  renderMindmap();
  scheduleSave();
}

function redo() {
  if (redoStack.length === 0) return;
  undoStack.push(cloneTree(tree));
  tree = redoStack.pop();
  activeNodeId = tree.id;
  renderOutline();
  renderMindmap();
  scheduleSave();
}

// ==================== MIND MAP RENDERER ====================
let mindmapDirty = true;
let mindmapTransform = { x: 0, y: 0, scale: 1 };
let svgEl, gEl;
let isPanning = false, panStart = { x: 0, y: 0 };

function renderMindmapDebounced() {
  mindmapDirty = true;
  if (currentView !== 'outline') renderMindmap();
}

function renderMindmap() {
  svgEl = document.getElementById('mindmapSvg');
  if (!svgEl) return;
  
  svgEl.innerHTML = '';
  
  // Defs for markers
  const defs = document.createElementNS('http://www.w3.org/2000/svg', 'defs');
  const marker = document.createElementNS('http://www.w3.org/2000/svg', 'marker');
  marker.setAttribute('id', 'arrow');
  marker.setAttribute('viewBox', '0 0 10 10');
  marker.setAttribute('refX', '10');
  marker.setAttribute('refY', '5');
  marker.setAttribute('markerWidth', '6');
  marker.setAttribute('markerHeight', '6');
  marker.setAttribute('orient', 'auto');
  const arrowPath = document.createElementNS('http://www.w3.org/2000/svg', 'path');
  arrowPath.setAttribute('d', 'M0,0 L10,5 L0,10 Z');
  arrowPath.setAttribute('fill', '#c0c0c0');
  marker.appendChild(arrowPath);
  defs.appendChild(marker);
  svgEl.appendChild(defs);

  gEl = document.createElementNS('http://www.w3.org/2000/svg', 'g');
  gEl.setAttribute('transform', `translate(${mindmapTransform.x},${mindmapTransform.y}) scale(${mindmapTransform.scale})`);
  
  const nodeMap = new Map();
  layoutTree(tree, nodeMap);
  
  // Draw connections first (behind nodes)
  drawConnections(tree, nodeMap, gEl);
  
  // Draw nodes
  drawNodes(tree, nodeMap, gEl);
  
  svgEl.appendChild(gEl);
  mindmapDirty = false;
  
  // Pan and zoom
  svgEl.onmousedown = (e) => {
    if (e.target === svgEl || e.target === gEl) {
      isPanning = true;
      panStart = { x: e.clientX - mindmapTransform.x, y: e.clientY - mindmapTransform.y };
      svgEl.style.cursor = 'grabbing';
    }
  };
  svgEl.onmousemove = (e) => {
    if (isPanning) {
      mindmapTransform.x = e.clientX - panStart.x;
      mindmapTransform.y = e.clientY - panStart.y;
      gEl.setAttribute('transform', `translate(${mindmapTransform.x},${mindmapTransform.y}) scale(${mindmapTransform.scale})`);
    }
  };
  svgEl.onmouseup = () => { isPanning = false; svgEl.style.cursor = 'grab'; };
  svgEl.onmouseleave = () => { isPanning = false; svgEl.style.cursor = 'grab'; };
  svgEl.onwheel = (e) => {
    e.preventDefault();
    const factor = e.deltaY < 0 ? 1.1 : 0.9;
    mindmapTransform.scale = Math.max(0.2, Math.min(3, mindmapTransform.scale * factor));
    gEl.setAttribute('transform', `translate(${mindmapTransform.x},${mindmapTransform.y}) scale(${mindmapTransform.scale})`);
  };
  svgEl.style.cursor = 'grab';
}

function layoutTree(node, nodeMap) {
  const config = { nodeWidth: 140, nodeHeight: 36, hGap: 60, vGap: 8 };
  
  function measure(n) {
    if (!n.children || n.children.length === 0 || n.collapsed) {
      n._w = config.nodeWidth;
      n._h = config.nodeHeight;
      return;
    }
    let totalH = 0;
    for (const child of n.children) {
      measure(child);
      totalH += child._totalH || child._h;
    }
    totalH += (n.children.length - 1) * config.vGap;
    n._totalH = Math.max(totalH, config.nodeHeight);
    n._h = config.nodeHeight;
  }
  measure(node);

  function layout(n, x, y) {
    n._x = x;
    n._y = y + ((n._totalH || n._h) - n._h) / 2;
    nodeMap.set(n.id, n);
    
    if (n.children && n.children.length > 0 && !n.collapsed) {
      let cy = y;
      for (const child of n.children) {
        const childTotalH = child._totalH || child._h;
        layout(child, x + config.nodeWidth + config.hGap, cy);
        cy += childTotalH + config.vGap;
      }
    }
  }

  layout(node, 80, 40);
}

function drawConnections(node, nodeMap, parent) {
  if (!node.children || node.collapsed) return;
  
  for (const child of node.children) {
    const p = nodeMap.get(node.id);
    const c = nodeMap.get(child.id);
    if (!p || !c) continue;
    
    const x1 = p._x + 140;
    const y1 = p._y + 18;
    const x2 = c._x;
    const y2 = c._y + 18;
    
    const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
    const cx1 = x1 + (x2 - x1) * 0.4;
    const cx2 = x1 + (x2 - x1) * 0.6;
    path.setAttribute('d', `M${x1},${y1} C${cx1},${y1} ${cx2},${y2} ${x2},${y2}`);
    path.setAttribute('stroke', branchColors[child.color || 0]);
    path.setAttribute('stroke-width', '1.5');
    path.setAttribute('fill', 'none');
    path.setAttribute('opacity', '0.5');
    parent.appendChild(path);
    
    drawConnections(child, nodeMap, parent);
  }
}

function drawNodes(node, nodeMap, parent) {
  const n = nodeMap.get(node.id);
  if (!n) return;
  
  const isActive = node.id === activeNodeId;
  const color = branchColors[node.color || 0];
  
  const g = document.createElementNS('http://www.w3.org/2000/svg', 'g');
  g.setAttribute('data-id', node.id);
  g.style.cursor = 'pointer';
  
  // Node background
  const rect = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
  rect.setAttribute('x', n._x);
  rect.setAttribute('y', n._y);
  rect.setAttribute('width', 140);
  rect.setAttribute('height', 36);
  rect.setAttribute('rx', 6);
  rect.setAttribute('fill', isActive ? color : '#ffffff');
  rect.setAttribute('stroke', color);
  rect.setAttribute('stroke-width', isActive ? 2 : 1);
  rect.setAttribute('filter', 'drop-shadow(0 1px 2px rgba(0,0,0,0.08))');
  g.appendChild(rect);
  
  // Text
  const text = document.createElementNS('http://www.w3.org/2000/svg', 'text');
  text.setAttribute('x', n._x + 10);
  text.setAttribute('y', n._y + 22);
  text.setAttribute('fill', isActive ? '#ffffff' : '#1a1a2e');
  text.setAttribute('font-size', '12');
  text.setAttribute('font-family', '-apple-system, BlinkMacSystemFont, sans-serif');
  text.textContent = node.title.length > 18 ? node.title.substring(0, 17) + '…' : node.title;
  text.setAttribute('pointer-events', 'none');
  g.appendChild(text);
  
  // Add child "+" button
  if (n._x !== undefined) {
    const addBtn = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
    addBtn.setAttribute('cx', n._x + 140 + 20);
    addBtn.setAttribute('cy', n._y + 18);
    addBtn.setAttribute('r', 8);
    addBtn.setAttribute('fill', color);
    addBtn.setAttribute('opacity', node.id === activeNodeId ? '0.9' : '0');
    addBtn.setAttribute('class', 'mm-add-btn');
    g.appendChild(addBtn);
    const addPlus = document.createElementNS('http://www.w3.org/2000/svg', 'text');
    addPlus.setAttribute('x', n._x + 140 + 20);
    addPlus.setAttribute('y', n._y + 22);
    addPlus.setAttribute('text-anchor', 'middle');
    addPlus.setAttribute('font-size', '12');
    addPlus.setAttribute('fill', '#fff');
    addPlus.setAttribute('font-weight', 'bold');
    addPlus.textContent = '+';
    addPlus.setAttribute('class', 'mm-add-btn');
    addPlus.setAttribute('opacity', node.id === activeNodeId ? '0.9' : '0');
    addPlus.style.pointerEvents = 'none';
    g.appendChild(addPlus);
  }
  
  // Child count badge
  if (node.children && node.children.length > 0 && !node.collapsed) {
    const badge = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
    badge.setAttribute('cx', n._x + 140 - 12);
    badge.setAttribute('cy', n._y + 8);
    badge.setAttribute('r', 8);
    badge.setAttribute('fill', '#e0e0e0');
    badge.setAttribute('pointer-events', 'none');
    g.appendChild(badge);
    const badgeText = document.createElementNS('http://www.w3.org/2000/svg', 'text');
    badgeText.setAttribute('x', n._x + 140 - 12);
    badgeText.setAttribute('y', n._y + 12);
    badgeText.setAttribute('text-anchor', 'middle');
    badgeText.setAttribute('font-size', '9');
    badgeText.setAttribute('fill', '#666');
    badgeText.setAttribute('pointer-events', 'none');
    badgeText.textContent = node.children.length;
    g.appendChild(badgeText);
  }
  
  // Hover effects
  g.addEventListener('mouseenter', () => {
    if (node.id !== activeNodeId) {
      rect.setAttribute('fill', '#f0f4ff');
    }
    // Show add button
    const btns = g.querySelectorAll('.mm-add-btn');
    btns.forEach(b => b.setAttribute('opacity', '0.7'));
  });
  g.addEventListener('mouseleave', () => {
    if (node.id !== activeNodeId) {
      rect.setAttribute('fill', '#ffffff');
    }
    const btns = g.querySelectorAll('.mm-add-btn');
    btns.forEach(b => b.setAttribute('opacity', node.id === activeNodeId ? '0.9' : '0'));
  });
  
  // Click: select node
  g.addEventListener('click', (e) => {
    // Check if click was on the "+" button area
    const svg = document.getElementById('mindmapSvg');
    const pt = svg.createSVGPoint();
    pt.x = e.clientX; pt.y = e.clientY;
    const ctm = g.getScreenCTM();
    if (ctm) {
      const localPt = pt.matrixTransform(ctm.inverse());
      if (localPt.x > n._x + 140 && localPt.x < n._x + 160 && 
          localPt.y > n._y + 8 && localPt.y < n._y + 28) {
        e.stopPropagation();
        pushUndo();
        addChildNode(node);
        renderOutline();
        renderMindmap();
        return;
      }
    }
    e.stopPropagation();
    activeNodeId = node.id;
    updateActiveStyles();
    renderOutline();
    renderMindmap();
  });
  
  // Double-click: inline edit in mind map
  g.addEventListener('dblclick', (e) => {
    e.stopPropagation();
    showMindmapInlineEdit(node, n);
  });
  
  // Right-click: context menu
  g.addEventListener('contextmenu', (e) => {
    e.preventDefault();
    e.stopPropagation();
    activeNodeId = node.id;
    updateActiveStyles();
    showMindmapContextMenu(e.clientX, e.clientY, node);
  });
  
  // Drag to reorder
  g.addEventListener('mousedown', (e) => {
    if (e.button !== 0) return;
    const svg = document.getElementById('mindmapSvg');
    const pt = svg.createSVGPoint();
    pt.x = e.clientX; pt.y = e.clientY;
    const ctm = g.getScreenCTM();
    if (ctm) {
      const localPt = pt.matrixTransform(ctm.inverse());
      if (localPt.x > n._x + 140) return; // Ignore + button area
    }
    
    const startX = e.clientX;
    const startY = e.clientY;
    let dragged = false;
    
    const onMove = (ev) => {
      const dx = Math.abs(ev.clientX - startX);
      const dy = Math.abs(ev.clientY - startY);
      if (dx > 5 || dy > 5) dragged = true;
    };
    const onUp = (ev) => {
      document.removeEventListener('mousemove', onMove);
      document.removeEventListener('mouseup', onUp);
      if (dragged && node.id !== 'root') {
        // Find target node
        const target = findDropTargetMindmap(ev.clientX, ev.clientY, nodeMap, node.id);
        if (target && target !== node.id) {
          pushUndo();
          moveNodeMindmap(node.id, target);
          renderOutline();
          renderMindmap();
          scheduleSave();
        }
      }
    };
    document.addEventListener('mousemove', onMove);
    document.addEventListener('mouseup', onUp);
  });
  
  parent.appendChild(g);
  
  // Recurse
  if (node.children && !node.collapsed) {
    node.children.forEach(child => drawNodes(child, nodeMap, parent));
  }
}

// Mind map inline edit
function showMindmapInlineEdit(node, pos) {
  const panel = document.getElementById('mindmapPanel');
  // Remove existing
  const old = panel.querySelector('.mm-inline-edit');
  if (old) old.remove();
  
  const input = document.createElement('input');
  input.className = 'mm-inline-edit';
  input.value = node.title;
  const svgRect = document.getElementById('mindmapSvg').getBoundingClientRect();
  input.style.cssText = `
    position:absolute; z-index:50;
    left:${svgRect.left + pos._x * mindmapTransform.scale + mindmapTransform.x}px;
    top:${svgRect.top + pos._y * mindmapTransform.scale + mindmapTransform.y}px;
    width:${140 * mindmapTransform.scale}px; height:${36 * mindmapTransform.scale}px;
    font-size:${12 * mindmapTransform.scale}px; padding:4px 8px;
    border:2px solid ${branchColors[node.color||0]}; border-radius:6px;
    background:#fff; outline:none; font-family:inherit;
    box-shadow:0 2px 8px rgba(0,0,0,0.2);
  `;
  
  input.addEventListener('blur', () => {
    pushUndo();
    node.title = input.value || node.title;
    input.remove();
    renderOutline();
    renderMindmap();
    scheduleSave();
  });
  input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') { input.blur(); }
    if (e.key === 'Escape') { input.value = node.title; input.blur(); }
  });
  
  panel.appendChild(input);
  setTimeout(() => { input.focus(); input.select(); }, 50);
}

// Mind map context menu
function showMindmapContextMenu(x, y, node) {
  const menu = document.getElementById('ctxMenu');
  menu.innerHTML = `
    <div class="item" onclick="mindmapEditNode()">✏️ 编辑文字</div>
    <div class="item" onclick="mindmapAddChild()">➕ 添加子节点 <span class="key">Tab</span></div>
    <div class="item" onclick="mindmapAddSibling()">↳ 添加同级 <span class="key">Enter</span></div>
    <div class="item" onclick="mindmapDeleteNode()">🗑️ 删除节点</div>
    <div class="item" onclick="mindmapChangeColor()">🎨 切换颜色</div>
    <div class="item" onclick="mindmapToggleCollapse()">📂 折叠/展开</div>
  `;
  menu.style.display = 'block';
  menu.style.left = Math.min(x, window.innerWidth - 180) + 'px';
  menu.style.top = Math.min(y, window.innerHeight - 220) + 'px';
  window._mmContextNode = node;
}

function mindmapEditNode() {
  const node = window._mmContextNode || findNode(activeNodeId, tree);
  if (!node) return;
  document.getElementById('ctxMenu').style.display = 'none';
  const nodeMap = new Map(); layoutTree(tree, nodeMap);
  const pos = nodeMap.get(node.id);
  if (pos) showMindmapInlineEdit(node, pos);
}
function mindmapAddChild() {
  const node = window._mmContextNode || findNode(activeNodeId, tree);
  if (!node) return;
  document.getElementById('ctxMenu').style.display = 'none';
  pushUndo(); addChildNode(node); renderOutline(); renderMindmap(); scheduleSave();
}
function mindmapAddSibling() {
  const node = window._mmContextNode || findNode(activeNodeId, tree);
  if (!node || node.id === 'root') return;
  document.getElementById('ctxMenu').style.display = 'none';
  pushUndo(); addSiblingNode(node); renderOutline(); renderMindmap(); scheduleSave();
}
function mindmapDeleteNode() {
  const node = window._mmContextNode || findNode(activeNodeId, tree);
  if (!node || node.id === 'root') return;
  document.getElementById('ctxMenu').style.display = 'none';
  pushUndo(); deleteNode(node); renderOutline(); renderMindmap(); scheduleSave();
}
function mindmapChangeColor() {
  const node = window._mmContextNode || findNode(activeNodeId, tree);
  if (!node) return;
  document.getElementById('ctxMenu').style.display = 'none';
  pushUndo();
  node.color = ((node.color || 0) + 1) % 8;
  renderOutline(); renderMindmap(); scheduleSave();
}
function mindmapToggleCollapse() {
  const node = window._mmContextNode || findNode(activeNodeId, tree);
  if (!node) return;
  document.getElementById('ctxMenu').style.display = 'none';
  node.collapsed = !node.collapsed;
  renderOutline(); renderMindmap(); scheduleSave();
}

function findDropTargetMindmap(x, y, nodeMap, excludeId) {
  let closest = null;
  let minDist = Infinity;
  for (const [id, pos] of nodeMap) {
    if (id === excludeId) continue;
    const cx = pos._x + 70;
    const cy = pos._y + 18;
    const dist = Math.sqrt((x - cx) ** 2 + (y - cy) ** 2);
    if (dist < minDist && dist < 100) {
      minDist = dist;
      closest = id;
    }
  }
  return closest;
}

function moveNodeMindmap(nodeId, targetId) {
  const node = findNode(nodeId, tree);
  const targetNode = findNode(targetId, tree);
  if (!node || !targetNode || nodeId === targetId) return;
  
  // Remove from old parent
  const oldParent = findParent(nodeId, tree);
  if (oldParent) oldParent.children = oldParent.children.filter(c => c.id !== nodeId);
  
  // Add to target as sibling
  const targetParent = findParent(targetId, tree);
  if (targetParent) {
    const idx = targetParent.children.findIndex(c => c.id === targetId);
    targetParent.children.splice(idx + 1, 0, node);
    node.color = targetNode.color;
  } else {
    tree.children.push(node);
  }
}

// ==================== VIEW MANAGEMENT ====================
function setView(view) {
  currentView = view;
  const outline = document.getElementById('outlinePanel');
  const mindmap = document.getElementById('mindmapPanel');
  const resizer = document.getElementById('resizer');
  
  document.getElementById('btnOutline').classList.remove('primary');
  document.getElementById('btnMindmap').classList.remove('primary');
  document.getElementById('btnBoth').classList.remove('primary');
  
  switch (view) {
    case 'outline':
      outline.classList.remove('hidden');
      mindmap.classList.add('hidden');
      resizer.style.display = 'none';
      document.getElementById('btnOutline').classList.add('primary');
      outline.style.flex = '1';
      break;
    case 'mindmap':
      outline.classList.add('hidden');
      mindmap.classList.remove('hidden');
      resizer.style.display = 'none';
      document.getElementById('btnMindmap').classList.add('primary');
      mindmap.style.flex = '1';
      renderMindmap();
      break;
    case 'both':
      outline.classList.remove('hidden');
      mindmap.classList.remove('hidden');
      resizer.style.display = 'block';
      document.getElementById('btnBoth').classList.add('primary');
      outline.style.flex = '1';
      mindmap.style.flex = '1';
      renderMindmap();
      break;
  }
}

// Resizer
document.getElementById('resizer').addEventListener('mousedown', (e) => {
  const outline = document.getElementById('outlinePanel');
  const mindmap = document.getElementById('mindmapPanel');
  const startX = e.clientX;
  const startWidth = outline.offsetWidth;
  
  const onMove = (ev) => {
    const dx = ev.clientX - startX;
    const newWidth = Math.max(200, startWidth + dx);
    outline.style.flex = 'none';
    outline.style.width = newWidth + 'px';
    mindmap.style.flex = '1';
  };
  const onUp = () => {
    document.removeEventListener('mousemove', onMove);
    document.removeEventListener('mouseup', onUp);
  };
  document.addEventListener('mousemove', onMove);
  document.addEventListener('mouseup', onUp);
});

// ==================== SAVE / LOAD ====================
function scheduleSave() {
  clearTimeout(window._saveTimeout);
  window._saveTimeout = setTimeout(saveLocal, 500);
}

function saveLocal() {
  const data = { name: docName, tree, nodeIdCounter };
  localStorage.setItem('mindmap-local', JSON.stringify(data));
  if (currentRoomId && ws && ws.readyState === 1) {
    ws.send(JSON.stringify({ type: 'update', data: tree }));
  }
}

function loadLocal() {
  const raw = localStorage.getItem('mindmap-local');
  if (raw) {
    try {
      const data = JSON.parse(raw);
      docName = data.name || '未命名思维导图';
      tree = data.tree || { id: 'root', title: '中心主题', children: [], collapsed: false, color: 0 };
      nodeIdCounter = data.nodeIdCounter || 1;
      document.getElementById('docName').value = docName;
    } catch(e) {
      tree = { id: 'root', title: '中心主题', children: [], collapsed: false, color: 0 };
    }
  }
}

document.getElementById('docName').addEventListener('input', (e) => {
  docName = e.target.value;
  scheduleSave();
});

// ==================== TOOLBAR ACTIONS ====================
function addSibling() { 
  const node = findNode(activeNodeId, tree);
  if (node) { pushUndo(); addSiblingNode(node); }
}
function addChild() {
  const node = findNode(activeNodeId, tree);
  if (node) { pushUndo(); addChildNode(node); }
}

// ==================== THEME ====================
function toggleTheme() {
  const html = document.documentElement;
  const current = html.getAttribute('data-theme');
  html.setAttribute('data-theme', current === 'dark' ? '' : 'dark');
  document.getElementById('btnTheme').textContent = current === 'dark' ? '🌓' : '☀️';
  localStorage.setItem('mindmap-theme', current === 'dark' ? 'light' : 'dark');
}

// ==================== COLOR PALETTE ====================
function buildColorPalette() {
  const container = document.getElementById('colorPalette');
  container.innerHTML = '';
  branchColors.forEach((color, i) => {
    const dot = document.createElement('span');
    dot.className = 'color-option';
    dot.style.background = color;
    dot.title = `颜色 ${i + 1}`;
    dot.onclick = () => {
      const node = findNode(activeNodeId, tree);
      if (node) {
        pushUndo();
        node.color = i;
        renderOutline();
        renderMindmap();
        scheduleSave();
      }
    };
    container.appendChild(dot);
  });
}

// ==================== COLLABORATION ====================
let ws = null;
let currentRoomId = null;
let reconnectTimer = null;

function connectWS() {
  // Only attempt WebSocket on localhost (server mode)
  if (location.hostname !== 'localhost' && location.hostname !== '127.0.0.1') {
    document.getElementById('collabStatus').textContent = '🌐 网页版';
    return;
  }
  
  const protocol = location.protocol === 'https:' ? 'wss:' : 'ws:';
  const wsUrl = `${protocol}//${location.host}`;
  
  try {
    ws = new WebSocket(wsUrl);
    
    ws.onopen = () => {
      document.getElementById('collabStatus').textContent = '🟢 已连接';
      if (currentRoomId) {
        ws.send(JSON.stringify({ type: 'join', roomId: currentRoomId, name: docName }));
      }
    };
    
    ws.onmessage = (e) => {
      const msg = JSON.parse(e.data);
      switch (msg.type) {
        case 'connected': break;
        case 'joined':
          document.getElementById('roomCode').textContent = msg.code;
          document.getElementById('peerCount').textContent = `👤 ${msg.peers} 人在线`;
          if (msg.data) { tree = msg.data; renderOutline(); renderMindmap(); }
          showToast('✅ 已加入协作房间');
          break;
        case 'updated':
          tree = msg.data;
          renderOutline();
          renderMindmap();
          break;
        case 'peer-joined':
          document.getElementById('peerCount').textContent = `👤 ${msg.peers} 人在线`;
          showToast('👤 有人加入');
          break;
        case 'peer-left':
          document.getElementById('peerCount').textContent = `👤 ${msg.peers} 人在线`;
          break;
      }
    };
    
    ws.onclose = () => {
      document.getElementById('collabStatus').textContent = '🔴 已断开';
      if (currentRoomId) reconnectTimer = setTimeout(connectWS, 3000);
    };
    
    ws.onerror = () => {
      document.getElementById('collabStatus').textContent = '💾 本地模式';
    };
  } catch(e) {
    document.getElementById('collabStatus').textContent = '💾 本地模式';
  }
}

function createRoom() {
  if (location.hostname !== 'localhost' && location.hostname !== '127.0.0.1') {
    showToast('🌐 网页版不支持协作。请下载服务端在本地运行：<br> github.com 查看 README');
    return;
  }
  const name = docName || '未命名思维导图';
  fetch('/api/rooms', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ name, data: tree })
  })
  .then(r => r.json())
  .then(room => {
    currentRoomId = room.id;
    document.getElementById('roomCode').textContent = room.code;
    document.getElementById('roomInfo').style.display = 'block';
    document.getElementById('collabStatus').textContent = '🟢 协作中';
    saveLocal();
    if (ws && ws.readyState === 1) {
      ws.send(JSON.stringify({ type: 'join', roomId: room.id, name }));
    }
    showToast('🏠 房间已创建！分享邀请码给朋友');
  });
}

function joinRoom() {
  if (location.hostname !== 'localhost' && location.hostname !== '127.0.0.1') {
    showToast('🌐 网页版不支持协作。请在本地运行服务端');
    return;
  }
  const code = document.getElementById('joinCode').value.trim().toUpperCase();
  if (!code || code.length !== 6) {
    showToast('请输入6位邀请码');
    return;
  }
  fetch(`/api/rooms/code/${code}`)
    .then(r => r.json())
    .then(room => {
      if (room.error) throw new Error(room.error);
      currentRoomId = room.id;
      document.getElementById('roomCode').textContent = code;
      document.getElementById('roomInfo').style.display = 'block';
      document.getElementById('collabStatus').textContent = '🟢 协作中';
      if (ws && ws.readyState === 1) {
        ws.send(JSON.stringify({ type: 'join', roomId: room.id }));
      }
      // Fetch full data
      return fetch(`/api/rooms/${room.id}`);
    })
    .then(r => r ? r.json() : null)
    .then(data => {
      if (data && data.data) {
        tree = data.data;
        renderOutline();
        renderMindmap();
        showToast('✅ 成功加入房间');
      }
    })
    .catch(err => showToast('❌ ' + err.message));
}

function leaveRoom() {
  currentRoomId = null;
  document.getElementById('roomInfo').style.display = 'none';
  document.getElementById('collabStatus').textContent = '💾 本地模式';
  if (reconnectTimer) { clearTimeout(reconnectTimer); reconnectTimer = null; }
  showToast('已离开房间，切换为本地模式');
}

function copyCode() {
  const code = document.getElementById('roomCode').textContent;
  if (code && code !== '------') {
    navigator.clipboard.writeText(code).then(() => {
      showToast('📋 邀请码已复制！');
    });
  }
}

function showCollab() {
  const sidebar = document.getElementById('sidebar');
  const collabSec = document.getElementById('collabSection');
  const shareSec = document.getElementById('shareSection');
  sidebar.classList.toggle('hidden');
  if (location.hostname !== 'localhost' && location.hostname !== '127.0.0.1') {
    // Web version: show sharing guide instead of WS collab
    if (collabSec) collabSec.style.display = 'none';
    if (shareSec) shareSec.style.display = 'block';
  } else {
    if (collabSec) collabSec.style.display = 'block';
    if (shareSec) shareSec.style.display = 'none';
  }
}

// ==================== IMPORT ====================
function showImport() {
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.innerHTML = `
    <div class="modal">
      <h2>📤 导入思维导图</h2>
      <p style="font-size:13px;color:#666;margin-bottom:8px;">支持格式：JSON、Markdown、纯文本大纲、幕布导出</p>
      <div class="export-options">
        <button onclick="importFile('json')">📦 导入 JSON 文件</button>

        <button onclick="window._importOverlay=this.closest('.modal-overlay');document.getElementById('importFileInput').click()">📂 自动识别文件</button>
      </div>
      <input type="file" id="importFileInput" accept=".json,.md,.txt,.opml,.mm" style="display:none" onchange="handleFileImport(event)">

  `;

function showPasteImport() {
  document.querySelector('.modal-overlay')?.remove();
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.innerHTML = `
    <div class="modal" style="max-width:600px;">
      <h2>📋 粘贴导入</h2>
      <p style="font-size:12px;color:#999;">支持 Markdown（# 标题层级）或 缩进文本（Tab/空格缩进）</p>
      <textarea id="pasteContent" style="width:100%;height:200px;padding:12px;border:1px solid var(--border);border-radius:var(--radius);font-size:13px;font-family:monospace;resize:vertical;" placeholder="粘贴内容...&#10;&#10;Markdown 示例：&#10;# 中心主题&#10;## 子主题1&#10;### 孙子主题&#10;## 子主题2&#10;&#10;或缩进文本：&#10;中心主题&#10;  子主题1&#10;    孙子主题&#10;  子主题2"></textarea>
      <div class="actions" style="margin-top:12px;">
        <select id="importFormat" style="padding:8px;border:1px solid var(--border);border-radius:var(--radius);font-size:13px;">
          <option value="auto">自动识别</option>
          <option value="markdown">Markdown</option>
          <option value="indent">缩进文本</option>
          <option value="json">JSON</option>
        </select>
        <div class="spacer" style="flex:1;"></div>
        <button onclick="this.closest('.modal-overlay').remove()">取消</button>
        <button class="primary" onclick="doPasteImport()">导入</button>
      </div>
    </div>
  `;
  document.body.appendChild(overlay);
  overlay.addEventListener('click', (e) => { if (e.target === overlay) overlay.remove(); });
}

function handleFileImport(e) {
  const file = e.target.files[0];
  if (!file) return;
  document.querySelector('.modal-overlay')?.remove();
  const reader = new FileReader();
  reader.onload = (ev) => {
    const text = ev.target.result;
    const ext = file.name.split('.').pop().toLowerCase();
    let parsed = null;
    try {
      if (ext === 'json') { parsed = JSON.parse(text); parsed = jsonToTree(parsed); }
      else if (ext === 'md') { parsed = markdownToTree(text); }
      else if (ext === 'opml' || ext === 'mm') { parsed = parseOPML(text); }
      else { parsed = autoParse(text); }
    } catch(err) { showToast('❌ 解析失败：' + err.message); return; }
    if (parsed) { applyImportedTree(parsed); }
  };
  reader.readAsText(file);
}

function importFile(format) {
  document.querySelector('.modal-overlay')?.remove();
  const input = document.createElement('input');
  input.type = 'file';
  input.accept = format === 'json' ? '.json' : '.json,.md,.txt';
  input.onchange = (e) => handleFileImport(e);
  input.click();
}

function doPasteImport() {
  const text = document.getElementById('pasteContent').value.trim();
  if (!text) { showToast('请粘贴内容'); return; }
  const format = document.getElementById('importFormat').value;
  let parsed = null;
  try {
    if (format === 'json' || (format === 'auto' && text.startsWith('{'))) {
      parsed = JSON.parse(text);
      parsed = jsonToTree(parsed);
    } else if (format === 'markdown' || (format === 'auto' && text.match(/^#+\s/m))) {
      parsed = markdownToTree(text);
    } else if (format === 'indent' || format === 'auto') {
      parsed = indentToTree(text);
    }
  } catch(err) { showToast('❌ 解析失败：' + err.message); return; }
  document.querySelector('.modal-overlay')?.remove();
  if (parsed) applyImportedTree(parsed);
}

function jsonToTree(obj) {
  if (obj.id && obj.title !== undefined) return obj; // Already a tree node
  if (Array.isArray(obj)) return { id: newNodeId(), title: '导入', children: obj.map(jsonToTree), color: 0, collapsed: false };
  const keys = Object.keys(obj);
  if (keys.length === 1) {
    const root = { id: newNodeId(), title: keys[0], children: [], color: 0, collapsed: false };
    const val = obj[keys[0]];
    if (Array.isArray(val)) val.forEach(v => root.children.push(jsonToTree(v)));
    else if (typeof val === 'object') Object.entries(val).forEach(([k,v]) => root.children.push({ id: newNodeId(), title: k, children: Array.isArray(v)?v.map(jsonToTree):[], color: (root.children.length) % 8, collapsed: false }));
    return root;
  }
  const root = { id: newNodeId(), title: '导入', children: [], color: 0, collapsed: false };
  Object.entries(obj).forEach(([k,v]) => {
    root.children.push({ id: newNodeId(), title: k, children: Array.isArray(v)?v.map(jsonToTree):[], color: root.children.length % 8, collapsed: false });
  });
  return root;
}

function markdownToTree(text) {
  const lines = text.split('\n').filter(l => l.trim());
  const root = { id: newNodeId(), title: '导入', children: [], color: 0, collapsed: false };
  const stack = [{ node: root, level: 0 }];
  let prevContent = null;
  
  for (const line of lines) {
    const hMatch = line.match(/^(#{1,6})\s+(.+)/);
    if (!hMatch) {
      if (prevContent && line.startsWith('- ')) {
        const content = line.replace(/^-\s+/, '');
        stack[stack.length-1].node.children.push({ id: newNodeId(), title: content, children: [], color: (stack.length) % 8, collapsed: false });
      }
      continue;
    }
    const level = hMatch[1].length;
    const title = hMatch[2];
    const newNode = { id: newNodeId(), title, children: [], color: level % 8, collapsed: false };
    
    while (stack.length > 1 && stack[stack.length-1].level >= level) stack.pop();
    stack[stack.length-1].node.children.push(newNode);
    stack.push({ node: newNode, level });
    prevContent = title;
  }
  
  if (root.children.length === 1) return root.children[0];
  return root;
}

function indentToTree(text) {
  const lines = text.split('\n').filter(l => l.trim());
  const root = { id: newNodeId(), title: lines[0].trim(), children: [], color: 0, collapsed: false };
  const stack = [{ node: root, indent: 0 }];
  
  for (let i = 1; i < lines.length; i++) {
    const line = lines[i];
    const trimmed = line.trim();
    if (!trimmed) continue;
    const indent = line.search(/\S/);
    const level = Math.floor(indent / 2); // 2 spaces = 1 level
    const newNode = { id: newNodeId(), title: trimmed, children: [], color: level % 8, collapsed: false };
    
    while (stack.length > 1 && stack[stack.length-1].indent >= level) stack.pop();
    if (stack[stack.length-1].indent < level) {
      stack[stack.length-1].node.children.push(newNode);
      stack.push({ node: newNode, indent: level });
    } else {
      stack[stack.length-1].node.children.push(newNode);
    }
  }
  return root;
}

function autoParse(text) {
  if (text.startsWith('{') || text.startsWith('[')) {
    const parsed = JSON.parse(text);
    return jsonToTree(parsed);
  }
  if (text.match(/^#+\s/m)) return markdownToTree(text);
  return indentToTree(text);
}

function applyImportedTree(newTree) {
  pushUndo();
  tree = newTree;
  docName = newTree.title || '导入的思维导图';
  document.getElementById('docName').value = docName;
  // Reassign IDs to avoid conflicts
  nodeIdCounter = 1;
  reassignIds(tree);
  activeNodeId = tree.id;
  renderOutline();
  if (currentView !== 'outline') renderMindmap();
  scheduleSave();
  showToast('✅ 导入成功！');
}

function reassignIds(node) {
  node.id = newNodeId();
  if (node.children) node.children.forEach(c => reassignIds(c));
}

function exportFormat(format) {
  document.querySelector('.modal-overlay')?.remove();
  
  const name = docName || '思维导图';
  let content, mime, ext;
  
  switch (format) {
    case 'png':
      exportPNG(name);
      return;
    case 'svg':
      exportSVG(name);
      return;
    case 'md':
      content = toMarkdown(tree, 0);
      mime = 'text/markdown'; ext = 'md';
      break;
    case 'txt':
      content = toText(tree, 0);
      mime = 'text/plain'; ext = 'txt';
      break;
    case 'json':
      content = JSON.stringify(tree, null, 2);
      mime = 'application/json'; ext = 'json';
      break;
    case 'html':
      content = toHTML(tree);
      mime = 'text/html'; ext = 'html';
      break;
  }
  
  download(`${name}.${ext}`, content, mime);
}

function toMarkdown(node, depth) {
  let md = '';
  const prefix = '#'.repeat(Math.min(depth + 1, 6));
  md += `${prefix} ${node.title}\n`;
  if (node.children) {
    node.children.forEach(child => { md += toMarkdown(child, depth + 1); });
  }
  return md;
}

function toText(node, depth) {
  let txt = '  '.repeat(depth) + (depth > 0 ? '- ' : '') + node.title + '\n';
  if (node.children) {
    node.children.forEach(child => { txt += toText(child, depth + 1); });
  }
  return txt;
}

function toHTML(node) {
  let html = '<ul>';
  html += `<li>${escapeHtml(node.title)}`;
  if (node.children && node.children.length > 0) {
    node.children.forEach(child => { html += toHTML(child); });
  }
  html += '</li></ul>';
  return html;
}

function escapeHtml(text) {
  const div = document.createElement('div');
  div.textContent = text;
  return div.innerHTML;
}

function exportPNG(name) {
  // Use SVG to render and convert
  const svgContent = document.getElementById('mindmapSvg').outerHTML;
  const canvas = document.createElement('canvas');
  const ctx = canvas.getContext('2d');
  canvas.width = 2000;
  canvas.height = 1500;
  
  const img = new Image();
  const svgBlob = new Blob([svgContent], { type: 'image/svg+xml;charset=utf-8' });
  const url = URL.createObjectURL(svgBlob);
  
  img.onload = () => {
    ctx.fillStyle = '#fafbfc';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.drawImage(img, 0, 0);
    canvas.toBlob(blob => {
      download(`${name}.png`, blob, 'image/png');
    });
    URL.revokeObjectURL(url);
  };
  img.src = url;
}

function exportSVG(name) {
  const svgContent = document.getElementById('mindmapSvg').outerHTML;
  download(`${name}.svg`, svgContent, 'image/svg+xml');
}

function download(filename, content, mime) {
  const blob = content instanceof Blob ? content : new Blob([content], { type: mime });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  a.click();
  URL.revokeObjectURL(url);
  showToast('✅ 导出成功: ' + filename);
}

// ==================== TOAST ====================
function showToast(msg) {
  const toast = document.getElementById('toast');
  toast.textContent = msg;
  toast.classList.add('show');
  clearTimeout(toast._timeout);
  toast._timeout = setTimeout(() => toast.classList.remove('show'), 2000);
}

// ==================== INIT ====================
function init() {
  // Load theme
  const theme = localStorage.getItem('mindmap-theme');
  if (theme === 'dark') {
    document.documentElement.setAttribute('data-theme', 'dark');
    document.getElementById('btnTheme').textContent = '☀️';
  }
  
  // Load data
  loadLocal();
  document.getElementById('docName').value = docName;
  
  // Render
  buildColorPalette();
  renderOutline();
  setView('outline');
  
  // Connect WebSocket
  connectWS();
  
  // Global keyboard
  document.addEventListener('keydown', (e) => {
    // Ctrl+S save
    if ((e.ctrlKey || e.metaKey) && e.key === 's') {
      e.preventDefault();
      saveLocal();
      showToast('💾 已保存');
    }
  });
  
  // Mindmap panel auto-render on resize
  window.addEventListener('resize', () => {
    if (currentView !== 'outline') renderMindmap();
  });
  
  // Context menu
  document.addEventListener('contextmenu', (e) => {
    const nodeEl = e.target.closest('.outline-node');
    if (nodeEl) {
      e.preventDefault();
      const id = nodeEl.getAttribute('data-id');
      activeNodeId = id;
      updateActiveStyles();
      showContextMenu(e.clientX, e.clientY);
    }
  });
  
  document.addEventListener('click', () => {
    document.getElementById('ctxMenu').style.display = 'none';
  });
  
  showToast('🚀 思维导图就绪 | Tab缩进 Enter新建 | 点击👥开始协作');
}

function showContextMenu(x, y) {
  const menu = document.getElementById('ctxMenu');
  menu.innerHTML = `
    <div class="item" onclick="addSibling()">➕ 添加同级 <span class="key">Enter</span></div>
    <div class="item" onclick="addChild()">↳ 添加子级 <span class="key">Tab</span></div>
    <div class="item" onclick="deleteActiveNode()">🗑️ 删除节点 <span class="key">Backspace</span></div>
    <div class="item" onclick="toggleCollapse()">📂 折叠/展开</div>
  `;
  menu.style.display = 'block';
  menu.style.left = Math.min(x, window.innerWidth - 180) + 'px';
  menu.style.top = Math.min(y, window.innerHeight - 200) + 'px';
}

function deleteActiveNode() {
  const node = findNode(activeNodeId, tree);
  if (node && node.id !== 'root') {
    pushUndo();
    deleteNode(node);
  }
}

function toggleCollapse() {
  const node = findNode(activeNodeId, tree);
  if (node) {
    node.collapsed = !node.collapsed;
    renderOutline();
    renderMindmap();
  }
}

init();
